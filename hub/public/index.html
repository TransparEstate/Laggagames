<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lagga Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/hub.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <p class="mark">Lagga Club</p>
    <p class="tag">Party-Spiele. Eins nach dem anderen.</p>
  </header>

  <main class="wrap">
    <section class="intro">
      <h1>Welches Spiel?</h1>
      <p>Wähle ein Spiel aus dem Katalog. Neue Spiele landen als Ordner unter <code>games/&lt;slug&gt;/</code>.</p>
    </section>
    <section id="gameGrid" class="grid" aria-live="polite">
      <p class="muted">Lade Spiele…</p>
    </section>
  </main>

  <script src="/js/hub.js"></script>
</body>
</html>
